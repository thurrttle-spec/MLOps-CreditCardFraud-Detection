# ============================================================
# Prometheus Configuration
# Scrapes metrics from the Flask serving app
# ============================================================

global:
  scrape_interval: 15s        # Scrape every 15 seconds
  evaluation_interval: 15s    # Evaluate rules every 15 seconds
  scrape_timeout: 10s

# ─── Alerting (optional) ─────────────────────────────────────
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# ─── Scrape Configurations ────────────────────────────────────
scrape_configs:

  # Prometheus scrapes itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Flask Credit Card Fraud Detection App
  - job_name: 'cc_fraud_flask_app'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      # Untuk Windows lokal (tanpa Docker): gunakan '127.0.0.1:5000' atau 'localhost:5000'
      # Untuk Docker: gunakan 'host.docker.internal:5000'
      - targets: ['127.0.0.1:5000']
        labels:
          app: 'cc-fraud-detection'
          environment: 'production'
          username: 'M_Fathurrohman'
