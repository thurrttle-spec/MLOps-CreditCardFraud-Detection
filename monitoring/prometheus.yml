# ============================================================
# Prometheus Configuration
# Scrapes metrics from the Flask serving app deployed on Railway
# ============================================================

global:
  scrape_interval: 15s        # Scrape every 15 seconds
  evaluation_interval: 15s    # Evaluate rules every 15 seconds
  scrape_timeout: 10s

# ─── Scrape Configurations ────────────────────────────────────
scrape_configs:

  # Prometheus scrapes itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Flask Credit Card Fraud Detection App on Railway
  - job_name: 'cc_fraud_flask_app'
    metrics_path: '/metrics'
    scheme: 'https'
    scrape_interval: 10s
    static_configs:
      - targets: ['mlops-creditcardfraud-detection-production.up.railway.app']
        labels:
          app: 'cc-fraud-detection'
          environment: 'production'
          username: 'M_Fathurrohman'
