version: '3.8'

# ============================================================
# Docker Compose for Monitoring Stack
# - Prometheus: Metrics collection & alerting
# - Grafana: Dashboard visualization (optional)
# ============================================================
# Usage:
#   cd monitoring/
#   docker-compose up -d
#
# Access:
#   Prometheus : http://localhost:9090
#   Grafana    : http://localhost:3000  (admin / admin)
# ============================================================

services:

  # ─── Prometheus ───────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.42.0
    container_name: cc_fraud_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - '9090:9090'
    extra_hosts:
      # Allow Prometheus container to reach host machine (Flask app)
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring

  # ─── Grafana (Optional — Dashboard Visualization) ─────────
  grafana:
    image: grafana/grafana:9.4.7
    container_name: cc_fraud_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
    networks:
      - monitoring

# ─── Volumes ─────────────────────────────────────────────────
volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ─── Networks ─────────────────────────────────────────────────
networks:
  monitoring:
    driver: bridge
