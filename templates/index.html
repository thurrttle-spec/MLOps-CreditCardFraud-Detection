<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Fraud Detection API</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #f1f5f9; color: #1e293b; }
        .container { max-width: 900px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; color: #0f172a; font-size: 24px; }
        p { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        .actions { display: flex; gap: 10px; margin-bottom: 20px; }
        button { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s; }
        .btn-submit { background: #2563eb; color: white; width: 100%; padding: 12px; font-size: 15px; margin-top: 15px; }
        .btn-submit:hover { background: #1d4ed8; }
        .btn-sample { background: #e2e8f0; color: #334155; }
        .btn-sample:hover { background: #cbd5e1; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; max-height: 380px; overflow-y: auto; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; }
        .field { display: flex; flex-direction: column; }
        label { font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 4px; }
        input { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; font-family: monospace; }
        #result { margin-top: 20px; padding: 16px; border-radius: 8px; font-size: 14px; display: none; }
        .normal { background: #dcfce7; border: 1px solid #86efac; color: #166534; }
        .fraud { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }
        .badge { font-weight: 700; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Credit Card Fraud Detection</h1>
        <p>Masukkan parameter transaksi di bawah ini atau gunakan tombol sampel untuk mengisi data otomatis.</p>
        
        <div class="actions">
            <button type="button" class="btn-sample" onclick="fillSample('normal')">Isi Data Transaksi Normal</button>
            <button type="button" class="btn-sample" onclick="fillSample('fraud')">Isi Data Transaksi Fraud</button>
        </div>

        <form id="predictForm">
            <div class="grid" id="inputGrid"></div>
            <button type="submit" class="btn-submit">Uji Prediksi Transaksi</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        const features = ["Time", "Amount", ...Array.from({length: 28}, (_, i) => `V${i+1}`)];
        const grid = document.getElementById("inputGrid");

        // Generate input fields
        features.forEach(feat => {
            const div = document.createElement("div");
            div.className = "field";
            div.innerHTML = `<label>${feat}</label><input type="number" step="any" id="${feat}" value="0">`;
            grid.appendChild(div);
        });

        // Sample Data Generator
        function fillSample(type) {
            if (type === 'normal') {
                document.getElementById("Time").value = 0;
                document.getElementById("Amount").value = 149.62;
                document.getElementById("V1").value = -1.359807;
                document.getElementById("V2").value = -0.072781;
                document.getElementById("V3").value = 2.536347;
                for (let i = 4; i <= 28; i++) document.getElementById(`V${i}`).value = (Math.random() * 0.2 - 0.1).toFixed(4);
            } else {
                document.getElementById("Time").value = 406;
                document.getElementById("Amount").value = 529.00;
                document.getElementById("V1").value = -2.312227;
                document.getElementById("V2").value = 1.951992;
                document.getElementById("V3").value = -1.609851;
                document.getElementById("V4").value = 3.997906;
                for (let i = 5; i <= 28; i++) document.getElementById(`V${i}`).value = (Math.random() * 4 - 2).toFixed(4);
            }
        }

        // Form Submission
        document.getElementById("predictForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const payload = {};
            features.forEach(feat => {
                payload[feat] = parseFloat(document.getElementById(feat).value) || 0.0;
            });

            const resultDiv = document.getElementById("result");
            resultDiv.style.display = "block";
            resultDiv.className = "";
            resultDiv.innerHTML = "<em>Memproses prediksi...</em>";

            try {
                const res = await fetch("/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok) {
                    const isFraud = data.is_fraud;
                    resultDiv.className = isFraud ? "fraud" : "normal";
                    resultDiv.innerHTML = `
                        <div class="badge">${data.label}</div>
                        <div><strong>Probabilitas Fraud:</strong> ${(data.fraud_probability * 100).toFixed(2)}%</div>
                        <div><strong>Latensi Server:</strong> ${data.latency_seconds} detik</div>
                    `;
                } else {
                    resultDiv.className = "fraud";
                    resultDiv.innerHTML = `<strong>Error:</strong> ${data.error || 'Gagal memproses'}`;
                }
            } catch (err) {
                resultDiv.className = "fraud";
                resultDiv.innerHTML = `<strong>Error Koneksi:</strong> ${err.message}`;
            }
        });

        // Default fill
        fillSample('normal');
    </script>
</body>
</html>
